name: Push Escalas - 12:00 Brasília

on:
  schedule:
    # 12:00 Brasília (UTC-3) = 15:00 UTC
    - cron: '0 15 * * *'
  workflow_dispatch:

jobs:
  send-escalas-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger escalas reminder (12h)
        run: |
          curl -X GET "${{ secrets.DEPLOY_URL }}/api/push/escalas-reminder" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json"
